  published: 2014-03-31T08:36:00Z
  parent_id: "0"
  content: |-
    Back in '92 when I was in college, I worked with a guy at Taco Bell who had a rusty old mid-70's Plymouth. It was awful. It was yellow, primer and rust. I will never forget it because of this: we had to run somewhere and get something one day and he said he would drive. We got in the car and his whole steering column was pretty much shattered, like someone had stolen it and popped the ignition. He picked up this rather large flat-head screwdriver out of his floorboard and stuck it in the ignition and started the car with it. Then, as if that was not crazy enough, he took the screwdriver out of the ignition and stuck it in the floor and that is what he shifted the gears with also. Maybe that was the anti-theft mechanism. I bet a thief could figure out how to start the car with a screwdriver but I doubt he would have ever found reverse and first on a 4 speed manual transmission with one!


    On a side note, I think "Poky Fork Bits" would be an excellent alternate title to this episode!
