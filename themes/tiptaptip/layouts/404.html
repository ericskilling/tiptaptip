{{ define "main" }}

<div class="terminal-box error-404" data-title="ERROR">
  <h1>404 - Page Not Found</h1>
  <p>The requested page could not be located in the system.</p>
  <p>// Try: <a href="{{ "/" | absURL }}">Return to Home</a></p>
  <pre>
  $ ls -la /var/www/
  drwxr-xr-x  page.html  <span style="color: var(--terminal-error);">NOT FOUND</span>
  drwxr-xr-x  index.html  OK
  dr-xr-x  about.html  OK
  </pre>
</div>

{{ end }}
