<footer class="site-footer">
  <div class="terminal-footer">
    <div class="footer-content">
      <p class="footer-text">// {{ .Site.Title }} - {{ now.Year }}</p>
      <p class="footer-text">// Built with <a href="https://gohugo.io">Hugo</a> + <a href="#">tiptaptip theme</a></p>
    </div>
    {{ if .Site.Params.rss_subscribe }}
    <div class="rss-link">
      <a href="{{ .Site.Params.rss_subscribe }}" class="rss-button">
        <span class="rss-icon">[RSS]</span> Subscribe
      </a>
    </div>
    {{ end }}
  </div>
</footer>
